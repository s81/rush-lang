name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          # macOS `gcc` is a clang alias; one entry per compiler is enough.
          - os: macos-latest
            cc: gcc
    env:
      RUSH_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  windows:
    name: test (windows-latest, ucrt64 gcc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          echo $bin >> $env:GITHUB_PATH
      - name: Test
        shell: pwsh
        run: |
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if (-not $gcc) { throw "gcc was not found on PATH" }
          $env:RUSH_CC = $gcc.Source
          cargo test
